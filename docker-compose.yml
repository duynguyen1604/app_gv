version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: app_gv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-app_gv}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app_gv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API & Automated 24/7 Cron Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_gv_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app_gv}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Lịch Dạy Giáo Viên <noreply@lichday.vn>"}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Web App (Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_gv_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

